<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <div class="container">
        <nav th:replace="~{fragments/navbar :: navbar}"></nav>
        <div>
            <div class="formulario">
                <h1 class="acciones">Iniciar sesión</h1>

                <p th:if="${param.error}" class="text-danger">El usuario o la contraseña no son correctos.</p>
                <p th:if="${param.logout}" class="text-success">Has cerrado la sesión.</p>

                <form th:action="@{/login}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <div class="campo">
                        <label for="username" >Usuario</label>
                        <input type="text" id="username" name="username" 
                               autocomplete="username" required autofocus>
                    </div>

                    <div class="campo">
                        <label for="password" >Contraseña</label>
                        <input type="password" id="password" name="password" 
                               autocomplete="current-password" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Entrar</button>
                    <a th:href="@{/products}" class="btn btn-secondary">Volver al catálogo</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
