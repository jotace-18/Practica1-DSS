<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo de productos</title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <script th:src="@{/js/products.js}" defer></script>
</head>
<body>
    <div class="container">
        <nav th:replace="~{fragments/navbar :: navbar}"></nav>
        <p th:if="${successMessage}" th:text="${successMessage}" class="message-success" role="status"></p>
        <p th:if="${errorMessage}" th:text="${errorMessage}" class="message-error" role="alert"></p>
        <h1 >Catálogo de productos</h1>

        <div class="acciones">
            <a th:href="@{/cart}" class="btn btn-secondary">Ver carrito</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/products/add}" class="btn btn-primary">Añadir producto</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/export}" class="btn btn-secondary">Exportar productos SQL</a>
        </div>

        <form th:action="@{/products}" method="get" class="formulario">
            <input type="hidden" name="sort" th:value="${sort}">
            <input type="hidden" name="direction" th:value="${direction}">
            <div class="campo">
                <label for="search">Buscar producto por nombre</label>
                <input type="text" id="search" name="search"
                       th:value="${search}" placeholder="Nombre del producto">
            </div>
            <div class="campo">
                <label for="minPrice">Precio mínimo</label>
                <input type="number" id="minPrice" name="minPrice"
                       min="0" step="0.01" th:value="${minPrice}">
            </div>
            <div class="campo">
                <label for="maxPrice">Precio máximo</label>
                <input type="number" id="maxPrice" name="maxPrice"
                       min="0" step="0.01" th:value="${maxPrice}">
            </div>
            <button type="submit" class="btn btn-primary">Buscar</button>
            <a th:href="@{/products}" class="btn btn-secondary">Ver todos</a>
        </form>

        <p th:if="${#lists.isEmpty(products)}" >
            No hay productos disponibles.
        </p>

        <div class="table-scroll">
            <table th:unless="${#lists.isEmpty(products)}">
                <thead>
                    <tr>
                        <th th:attr="aria-sort=${sort == 'name' ? (direction == 'asc' ? 'ascending' : 'descending') : 'none'}">
                            <a class="sort-link" th:href="@{/products(page=0,sort='name',direction=${sort == 'name' and direction == 'asc' ? 'desc' : 'asc'},search=${search},minPrice=${minPrice},maxPrice=${maxPrice})}">
                                Producto <span aria-hidden="true" th:text="${sort == 'name' ? (direction == 'asc' ? '↑' : '↓') : '↕'}">↕</span>
                            </a>
                        </th>
                        <th th:attr="aria-sort=${sort == 'price' ? (direction == 'asc' ? 'ascending' : 'descending') : 'none'}">
                            <a class="sort-link" th:href="@{/products(page=0,sort='price',direction=${sort == 'price' and direction == 'asc' ? 'desc' : 'asc'},search=${search},minPrice=${minPrice},maxPrice=${maxPrice})}">
                                Precio <span aria-hidden="true" th:text="${sort == 'price' ? (direction == 'asc' ? '↑' : '↓') : '↕'}">↕</span>
                            </a>
                        </th>
                        <th>Opciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="product : ${products}">
                        <td th:text="${product.name}">Nombre del producto</td>
                        <td th:text="|${#numbers.formatDecimal(product.price, 1, 'POINT', 2, 'COMMA')} €|">Precio</td>
                        <td>
                            <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-primary">Añadir al carrito</button>
                            </form>
                            <a sec:authorize="hasRole('ADMIN')" th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-secondary">Editar</a>
                            <form sec:authorize="hasRole('ADMIN')" th:action="@{/products/delete/{id}(id=${product.id})}" method="post" class="d-inline delete-product" th:attr="data-product-name=${product.name}">
                                <button type="button" class="btn btn-danger delete-trigger">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <nav th:if="${productPage.totalPages > 0}" class="paginacion" aria-label="Paginación del catálogo">
            <a th:if="${productPage.hasPrevious()}" class="btn btn-secondary"
               th:href="@{/products(page=${productPage.number - 1},search=${search},minPrice=${minPrice},maxPrice=${maxPrice},sort=${sort},direction=${direction})}">Anterior</a>
            <span th:text="|Página ${productPage.number + 1} de ${productPage.totalPages} · ${productPage.totalElements} productos|">Página 1</span>
            <a th:if="${productPage.hasNext()}" class="btn btn-secondary"
               th:href="@{/products(page=${productPage.number + 1},search=${search},minPrice=${minPrice},maxPrice=${maxPrice},sort=${sort},direction=${direction})}">Siguiente</a>
        </nav>
    </div>
    <dialog id="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-description">
        <h2 id="delete-title">Eliminar producto</h2>
        <p id="delete-description">¿Quieres eliminar «<strong id="delete-product-name"></strong>»?</p>
        <div class="dialog-actions">
            <button type="button" id="delete-cancel" class="btn btn-secondary" autofocus>Cancelar</button>
            <button type="button" id="delete-confirm" class="btn btn-danger">Confirmar eliminación</button>
        </div>
    </dialog>
</body>
</html>
