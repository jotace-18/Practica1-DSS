<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${product.id == null ? 'Añadir producto' : 'Editar producto'}">Producto</title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <div class="container">
        <nav th:replace="~{fragments/navbar :: navbar}"></nav>
        <h1  th:text="${product.id == null ? 'Añadir producto' : 'Editar producto'}">Producto</h1>

        <div class="formulario">
            <form th:action="${product.id == null} ? @{/products/add} : @{/products/edit/{id}(id=${product.id})}" th:object="${product}" method="post">
                <div class="campo">
                    <label for="name" >Nombre del producto</label>
                    <input type="text" id="name" th:field="*{name}"  required>
                </div>
                <div class="campo">
                    <label for="price" >Precio</label>
                    <input type="number" id="price" th:field="*{price}"  min="0" step="0.01" required>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/products}" class="btn btn-secondary">Volver al catálogo</a>
            </form>
        </div>
    </div>
</body>
</html>
